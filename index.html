<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="./img/logo.png" alt="Logo do Sorteador Online">
            <p>Sorteador<span>Online</span> </p>
        </div>
        <nav>
            <p>Rápido</p>
            <p>Simples</p>
            <p>Gratuito</p>
        </nav>
    </header>
    <main>
        <h1>Sorteador de Números</h1>
        <p class="subtitle">
            Escolha o intervalo e deixe a sorte decidir!
        </p>
        <section class="sorteador">
            <!-- ÁREA DOS NÚMEROS -->
            <div class="numeros">
                <p>Sortear um número entre:</p>
                <div class="inputs">
                    <div>
                        <label for="number1">Número inicial</label>
                        <input id="number1" class="number1" type="number" placeholder="1">
                    </div>
                    <div>
                        <label for="number2">Número final</label>
                        <input id="number2" class="number2" type="number" placeholder="100">
                    </div>
                </div>
                <button onclick="desligarBotao()" class="button-sorteio">🎲 SORTEAR</button>
            </div>
            <!-- ÁREA DO RESULTADO -->
            <div class="resultado">
                <p class="titulo-resultado">🏆 RESULTADO </p>
                <p class="result">-</p>
                <p class="descricao-resultado">Número sorteado</p>
            </div>
            <button class="button-novamente">
                ↻ Sortear de novo
            </button>
        </section>
    </main>
    <footer>
        <p>Sorteador Online • Seu número, do seu jeito!</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
